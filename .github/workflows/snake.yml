name: Gerar snake animation

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite
  workflow_dispatch: {} # permite rodar manualmente também
  push:
    branches:
      - main

jobs:
  gerar-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gerar SVG da snake (tema roxo/rosa)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/dracula-snake.svg?color_snake=%23bd93f9,%23ff79c6&color_dot=%2344475a&color_empty=%23282a36

      - name: Publicar no branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
